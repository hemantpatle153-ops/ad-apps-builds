name: Feeds

# Every 15 minutes: read the official job pages, extract and fact-check new
# notices with Claude, Gemini or DeepSeek, build the quiz content, and publish the JSON files
# to the feed-data branch that Vacancy Bell and Roz Quiz read.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      part:
        description: "jobs, quiz or both"
        default: both

concurrency:
  group: feeds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: feeds/requirements.txt
      - name: OCR tools for scanned notices
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-hin poppler-utils >/dev/null
      - run: pip install -r feeds/requirements.txt
      - name: Check out the published files
        id: data
        run: |
          if git ls-remote --exit-code --heads origin feed-data >/dev/null; then
            git fetch --depth 1 origin feed-data
            git worktree add data origin/feed-data
          else
            git worktree add --detach data
            git -C data checkout --orphan feed-data
            git -C data rm -rfq .
          fi
      - name: Run the pipeline
        timeout-minutes: 35  # Publish still runs after a step timeout
        working-directory: feeds
        env:
          # Any one AI key is enough; with several, LLM_PROVIDER picks one
          # (claude, gemini or deepseek), else Claude > Gemini > DeepSeek.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # India relay on Cloud Run (feeds/relay); without it pages are fetched directly
          FETCH_RELAY_URL: ${{ secrets.FETCH_RELAY_URL }}
          FETCH_RELAY_TOKEN: ${{ secrets.FETCH_RELAY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_VERIFY_MODEL: ${{ vars.CLAUDE_VERIFY_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_VERIFY_MODEL: ${{ vars.GEMINI_VERIFY_MODEL }}
        run: |
          case "${{ github.event.inputs.part }}" in
            jobs) python -m feedbot run --data ../data --jobs ;;
            quiz) python -m feedbot run --data ../data --quiz ;;
            *) python -m feedbot run --data ../data ;;
          esac
      - name: Publish
        if: ${{ !cancelled() && steps.data.outcome == 'success' }}
        working-directory: data
        run: |
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "feeds: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:feed-data
